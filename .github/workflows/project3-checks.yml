name: Project 3 AV command center checks
on:
  push:
    paths:
      - project3-av-command-center.html
      - index.html
      - scripts/project3-map-density.js
      - scripts/test-project3-map-density.cjs
      - scripts/project3-engine.js
      - scripts/project3-analytics.js
      - scripts/project3-planning.js
      - scripts/project3-planning-ui.js
      - scripts/test-project3-analytics.cjs
      - scripts/test-project3-planning.cjs
      - scripts/test-project3-engine.cjs
      - PROJECT3_ROADMAP.md
      - .github/workflows/project3-checks.yml
  workflow_dispatch:
jobs:
  project3-mvp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax and dispatch acceptance tests
        run: |
          node --check scripts/project3-map-density.js
          node --check scripts/test-project3-map-density.cjs
          node --check scripts/project3-engine.js
          node --check scripts/project3-analytics.js
          node --check scripts/project3-planning.js
          node --check scripts/project3-planning-ui.js
          node --check scripts/test-project3-planning.cjs
          node --check scripts/test-project3-analytics.cjs
          node --check scripts/test-project3-engine.cjs
          node --test scripts/test-project3-engine.cjs scripts/test-project3-analytics.cjs scripts/test-project3-planning.cjs scripts/test-project3-map-density.cjs
      - name: Validate static integration, disclosure and inline JS
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const page=fs.readFileSync('project3-av-command-center.html','utf8');
          const home=fs.readFileSync('index.html','utf8');
          assert(home.includes('href="project3-av-command-center.html"'),'Portfolio navigation missing');
          assert(page.includes('src="scripts/project3-map-density.js'),'Map density module missing');
          assert(page.includes('src="scripts/project3-engine.js'),'Engine script missing');
          assert(page.includes('src="scripts/project3-analytics.js'),'Analytics script missing');
          assert(page.includes('src="scripts/project3-planning.js'),'Planning script missing');
          assert(page.includes('src="scripts/project3-planning-ui.js'),'Planning UI script missing');
          for(const id of ['vehicleMarkers','vehicleSelect','incidentType','createIncident','queue','providerSelect','assignProvider','advanceIncident','kAvail','kP90','kCost','announcer'])assert(page.includes('id="'+id+'"'),'Missing UI control: '+id);
          for(const id of ['aProviders','aTypes','aAreas','aStages','aReady','aSla'])assert(page.includes('id="'+id+'"'),'Missing analytics panel: '+id);
          for(const id of ['planning','planFleet','planRate','planBudget','planTable','planRecommendation','planExamples','planMethod'])assert(page.includes('id="'+id+'"'),'Missing planning control: '+id);
          assert(page.includes('Synthetic scenario')&&page.includes('No actual company or partner data'),'Synthetic disclosures missing');
          const inline=page.split('<script>').slice(1).map(block=>block.split('</script>')[0]);
          assert(inline.length,'Inline UI script missing');
          for(const block of inline)new Function(block);
          console.log('Project 3 static integration validated');
          NODE
