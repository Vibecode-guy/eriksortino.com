name: Project 2 offline validation

on:
  push:
    branches: [main]
    paths:
      - 'la-service-operations.html'
      - 'scripts/build-myla311-geo.cjs'
      - 'scripts/test-myla311-geo.cjs'
      - '.github/workflows/project2-data-checks.yml'
  pull_request:
    paths:
      - 'la-service-operations.html'
      - 'scripts/build-myla311-geo.cjs'
      - 'scripts/test-myla311-geo.cjs'
      - '.github/workflows/project2-data-checks.yml'

permissions:
  contents: read

jobs:
  validate-project2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test reproducible MyLA311 geographic aggregation
        run: node --test scripts/test-myla311-geo.cjs
      - name: Check Project 2 inline JavaScript syntax
        run: |
          node -e "const fs=require('fs');const vm=require('vm');const s=fs.readFileSync('la-service-operations.html','utf8');const start=s.indexOf('<script>'),end=s.lastIndexOf('</script>');if(start<0||end<=start)throw Error('Missing inline script');new vm.Script(s.slice(start+8,end));console.log('Project 2 inline JS syntax passed')"
